<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nana Playlist</title><link rel="stylesheet" href="style.css"></head><body>
<div class="layout">
<section class="leftPane">
<h2>🎵 Your Playlist</h2>
<div class="toolbar">
<input id="search" placeholder="検索">
<button onclick="shufflePlay()">Shuffle</button>
<button onclick="toggleFavOnly()">★</button>
<button onclick="sortNewest()">新しい順</button>
<button onclick="sortOldest()">古い順</button>
</div>
<div id="filters"></div>
<div id="memberFilters"></div>
<div id="tagFilters"></div>
<div id="count"></div>
<div id="list"></div>
</section>
<section class="rightPane">
<iframe id="player" allow="autoplay"></iframe>
<div class="nowbar"><span class="nowTitle" id="nowPlaying">未再生</span><div><button onclick="nextPlay()">Next ▶</button></div></div>
</section>
</div>
<script src="script.js"></script>
</body></html>
